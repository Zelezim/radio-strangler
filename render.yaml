# Render blueprint: the same two images as docker-compose.yml, on the free plan.
#
# DATABASE_URL (both services) must be the Supabase SESSION pooler string, port 5432, ending in
# ?sslmode=require. Not the transaction pooler (6543): migrations hold pg_advisory_lock, which
# needs a stable session. Not the direct db.<ref>.supabase.co host either: it is IPv6-only and
# Render cannot reach it.
#
# Values marked sync: false are secrets or depend on the deploy; Render asks for them on the
# first deploy and they are never stored in this public repository.

services:
  - type: web
    name: radio-strangler
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      # Public URL of radio-legacy-php, e.g. https://radio-legacy-php.onrender.com. Free
      # services cannot receive private-network traffic, so the internal hostname is not an option.
      - key: LEGACY_URL
        sync: false
      # Generated by Render on first deploy; read it from the dashboard to call /admin.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DEMO_INJECT_BUGS
        value: "true"
      - key: LOG_LEVEL
        value: info

  - type: web
    name: radio-legacy-php
    runtime: docker
    plan: free
    dockerfilePath: ./legacy-php/Dockerfile
    dockerContext: ./legacy-php
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
